server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # The art is content-addressed by nothing, but it only changes when the
    # character does, which is close to never.
    location /img/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }

    # The markup, the code, and the fallback payload must not go stale after a
    # deploy. There is no build hash on these filenames, so revalidation is the
    # only thing standing between a redeploy and a browser serving the old JS.
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    location / { try_files $uri $uri/ =404; }
}
